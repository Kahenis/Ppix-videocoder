name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 1.5.10). Leave empty to read app/config.py'
        required: false
        default: ''
      publish_release:
        description: 'Publish GitHub Release'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}".Trim()
          if (-not $ver) {
            if ($env:GITHUB_REF_NAME -match '^v') {
              $ver = $env:GITHUB_REF_NAME -replace '^v',''
            }
          }
          if (-not $ver) {
            $cfg = Get-Content -Raw "app\config.py"
            if ($cfg -match 'APP_VERSION\s*=\s*"([^"]+)"') { $ver = $Matches[1] }
          }
          if (-not $ver) { $ver = "0.0.0" }
          Write-Host "VERSION=$ver"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg (Windows essentials)
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extract -Force
          $bin = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          Copy-Item $bin.FullName -Destination ffmpeg\ffmpeg.exe
          $probe = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if ($probe) { Copy-Item $probe.FullName -Destination ffmpeg\ffprobe.exe }
          Write-Host "FFmpeg size:" (Get-Item ffmpeg\ffmpeg.exe).Length

      - name: Build with PyInstaller (one-folder, FFmpeg bundled)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "Ppix-Videocoder" `
            --add-data "ffmpeg;ffmpeg" `
            --hidden-import=plexapi `
            --hidden-import=plexapi.myplex `
            --hidden-import=plexapi.server `
            --hidden-import=customtkinter `
            --hidden-import=PIL `
            --hidden-import=pyperclip `
            --collect-all customtkinter `
            main.py

      - name: Create release zip
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $out = "Ppix-Videocoder-$ver-windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse -Force "dist\Ppix-Videocoder\*" $out\
          "Ppix-Videocoder $ver`nhttps://github.com/Kahenis/Ppix-videocoder" | Set-Content -Path "$out\VERSION.txt" -Encoding utf8
          Compress-Archive -Path $out -DestinationPath "$out.zip" -Force
          Write-Host "Created $out.zip"
          Get-Item "$out.zip" | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ppix-Videocoder-windows
          path: Ppix-Videocoder-*-windows.zip
          retention-days: 90

      - name: Create GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release != 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Ppix-Videocoder v${{ steps.ver.outputs.version }}
          files: Ppix-Videocoder-*-windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Ppix-Videocoder v${{ steps.ver.outputs.version }}

            Application Windows autonome pour optimiser les codecs vidéo de vos bibliothèques **Plex**.

            ### Installation
            1. Téléchargez `Ppix-Videocoder-${{ steps.ver.outputs.version }}-windows.zip`
            2. Décompressez l'archive
            3. Lancez `Ppix-Videocoder.exe`
            4. FFmpeg est déjà inclus — rien d'autre à installer

            ### Fonctionnalités
            - Connexion Plex via PIN (plex.tv/link)
            - Scan Films + Séries (listes paginées, grandes bibliothèques)
            - Réencodage H.265 / H.264 (CPU ou NVIDIA)
            - File d'attente avec progression sans clignotement
            - Remplacement auto/manuel + analyse Plex forcée
            - Paramètres persistants (`%USERPROFILE%\.ppix-videocoder\`)

            ### Notes
            Développement personnel. Testez d'abord en mode essai. Aucune garantie — utilisez à vos risques.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
