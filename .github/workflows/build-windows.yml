name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg (Windows essentials)
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extract -Force
          $bin = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          Copy-Item $bin.FullName -Destination ffmpeg\ffmpeg.exe
          $probe = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if ($probe) { Copy-Item $probe.FullName -Destination ffmpeg\ffprobe.exe }
          Write-Host "FFmpeg size:" (Get-Item ffmpeg\ffmpeg.exe).Length

      - name: Build with PyInstaller (one-folder, FFmpeg bundled)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "Ppix-Videocoder" `
            --add-data "ffmpeg;ffmpeg" `
            --hidden-import=plexapi `
            --hidden-import=plexapi.myplex `
            --hidden-import=plexapi.server `
            --hidden-import=customtkinter `
            --hidden-import=PIL `
            --hidden-import=pyperclip `
            --collect-all customtkinter `
            main.py

      - name: Create release zip
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) { $ver = $env:GITHUB_REF_NAME -replace '^v','' }
          if (-not $ver) { $ver = "1.0.0" }
          $out = "Ppix-Videocoder-$ver-windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse -Force "dist\Ppix-Videocoder\*" $out\
          Compress-Archive -Path $out -DestinationPath "$out.zip" -Force
          Write-Host "Created $out.zip"
          Get-Item "$out.zip" | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ppix-Videocoder-windows
          path: Ppix-Videocoder-*-windows.zip
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Ppix-Videocoder-*-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
